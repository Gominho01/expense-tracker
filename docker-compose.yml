services:
  postgres:
    image: postgres:16-alpine
    container_name: gastos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
      POSTGRES_DB: gastos_dev
    ports:
      - "5432:5432"
    volumes:
      - gastos_postgres_data:/var/lib/postgresql/data

volumes:
  gastos_postgres_data:
